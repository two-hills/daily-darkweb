[project]
name = "daily-darkweb"
version = "0.1.0"
description = "Clearnet-first dark-web threat-intelligence pipeline: collect, score, dedupe, digest"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.scripts]
daily-darkweb = "daily_darkweb.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_darkweb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assert usage; fixture strings aren't real passwords

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["daily_darkweb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

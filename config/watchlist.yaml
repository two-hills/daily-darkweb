# Awareness-mode interest filters. All lists optional; empty list = filter off.
# Matching: org/keyword = case-insensitive word-boundary; domains = exact + subdomains.
org_names: []       # add specific orgs later (employers, suppliers, customers)
domains: []         # add owned/watched domains later
keywords:           # technologies & topics to prioritize (drives HIGH alerts on KEV/DLS)
  - "cisco"
  - "fortinet"
  - "palo alto"
  - "check point"   # CISA KEV spells the vendor as two words
  - "checkpoint"
  - "vpn"
  - "firewall"
  - "vmware"
  - "citrix"
  - "exchange"
  - "active directory"
  - "ransomware"
  - "breach"        # word-boundary match: inflections must be listed explicitly
  - "breached"
  - "breaches"
sectors:            # sectors of interest (substring match vs source sector labels)
  - "Healthcare"
  - "Financial"
countries:          # ISO country codes of interest: APJC (Asia Pacific, Japan, China)
  # Greater China, Japan, Korea
  - "CN"
  - "HK"
  - "MO"
  - "TW"
  - "JP"
  - "KR"
  # ASEAN
  - "TH"
  - "SG"
  - "MY"
  - "ID"
  - "PH"
  - "VN"
  - "KH"
  - "LA"
  - "MM"
  - "BN"
  - "TL"
  # Australia, New Zealand, Pacific
  - "AU"
  - "NZ"
  - "FJ"
  - "PG"
  # India and South Asia
  - "IN"
  - "BD"
  - "LK"
  - "NP"
  - "BT"
  - "MV"

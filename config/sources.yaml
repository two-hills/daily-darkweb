ransomware_live:
  enabled: true
  # API PRO (free key, sent as X-API-KEY): cloud runs get it from the environment's
  # API credentials, local runs from RANSOMWARE_LIVE_API_KEY in .env — never from here.
  base_url: "https://api-pro.ransomware.live"
  timeout_seconds: 15.0
  max_items: 100
  group_profiles: 5   # threat-actor profiles (TTPs, exploited CVEs, tools); 0 = off

cisa_kev:
  enabled: true
  recent_days: 30     # minimum lookback; auto-widened to cover gaps since the last
                      # successful run (capped at 365d) so idle spells miss nothing
  max_items: 200

# Gated: enabling this raises a config error until the project has documented
# legal approval for direct onion collection (see docs/architecture.md).
tor_onion:
  enabled: false
